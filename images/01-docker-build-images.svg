  <line x1="0" y1="36" x2="800" y2="36" stroke="#313244" stroke-width="1"/>
  <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <text x="20" y="65" fill="#a6e3a1">$ docker build -t campus-hub-backend ./backend</text>
    <text x="20" y="90" fill="#cdd6f4">[+] Building 13.4s (10/10) FINISHED</text>
    <text x="20" y="115" fill="#cdd6f4"> =&gt; [internal] load build context</text>
    <text x="20" y="140" fill="#cdd6f4"> =&gt; [1/5] FROM docker.io/library/eclipse-temurin:21-jre-alpine</text>
    <text x="20" y="165" fill="#cdd6f4"> =&gt; [4/5] COPY build/libs/*.jar app.jar</text>
    <text x="20" y="190" fill="#cdd6f4"> =&gt; naming to docker.io/library/campus-hub-backend:latest</text>
    <text x="20" y="225" fill="#a6e3a1">$ docker images | grep campus-hub</text>
    <text x="20" y="255" fill="#89b4fa">REPOSITORY           TAG       IMAGE ID       SIZE</text>
    <text x="20" y="280" fill="#f5e0dc">campus-hub-backend   latest    8ea2875c6b9c   186MB</text>
