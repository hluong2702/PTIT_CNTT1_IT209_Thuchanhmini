<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <rect width="850" height="300" rx="10" fill="#1e1e2e"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  <text x="425" y="24" fill="#a6adc8" font-family="monospace" font-size="12" text-anchor="middle">Actuator Health Endpoint Verification</text>
  <line x1="0" y1="36" x2="850" y2="36" stroke="#313244" stroke-width="1"/>
  <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <text x="20" y="65" fill="#a6e3a1">$ curl -i http://localhost:8080/actuator/health</text>
    <text x="20" y="95" fill="#f9e2af">HTTP/1.1 200 OK</text>
    <text x="20" y="120" fill="#cdd6f4">Content-Type: application/vnd.spring-boot.actuator.v3+json</text>
    <text x="20" y="145" fill="#cdd6f4">Date: Tue, 13 Oct 2026 05:32:33 GMT</text>
    <text x="20" y="170" fill="#cdd6f4">Transfer-Encoding: chunked</text>
    <text x="20" y="210" fill="#a6e3a1">{"status":"UP","groups":["liveness","readiness"]}</text>
    <text x="20" y="250" fill="#89dceb"># Endpoint trả về HTTP 200 và trạng thái UP hoàn toàn chính xác!</text>
  </g>
</svg>
